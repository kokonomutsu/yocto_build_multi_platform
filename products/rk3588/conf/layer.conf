# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rk3588-custom"
BBFILE_PATTERN_rk3588-custom = "^${LAYERDIR}/"
BBFILE_PRIORITY_rk3588-custom = "6"

LAYERDEPENDS_rk3588-custom = "core"
LAYERSERIES_COMPAT_rk3588-custom = "kirkstone"

