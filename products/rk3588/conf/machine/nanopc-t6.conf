#@TYPE: Machine
#@NAME: NanoPC-T6
#@DESCRIPTION: NanoPC-T6 RK3588 board from FriendlyElec

require conf/machine/include/rk3588.inc

# Kernel configuration
# Note: Using fitImage (from rk3588s.inc) which includes device tree
# Set to empty string for fitImage (device tree is included in fitImage)
# Specific device tree can be added later when available in kernel source
KERNEL_DEVICETREE = ""

# U-Boot configuration
# Note: U-Boot 2022.01 doesn't have rk3588_defconfig
# Using evb-rk3568_defconfig as base (RK3568 is similar to RK3588)
# This is a workaround until proper RK3588 defconfig is available
UBOOT_MACHINE ?= "evb-rk3568_defconfig"

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

MACHINE_FEATURES += "wifi bluetooth"

# Use linux-yocto as kernel provider (from rockchip-defaults.inc)
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
