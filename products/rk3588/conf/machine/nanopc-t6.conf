#@TYPE: Machine
#@NAME: NanoPC-T6
#@DESCRIPTION: NanoPC-T6 RK3588 board from FriendlyElec

require conf/machine/include/rk3588.inc

# Kernel configuration
# Note: Using fitImage (from rk3588s.inc) which includes device tree
# Specific device tree will be selected by kernel or can be added later
# Commented out until device tree is available in kernel source
# KERNEL_DEVICETREE ?= "rockchip/rk3588-nanopc-t6.dtb"

# U-Boot configuration
# Note: Using generic RK3588 U-Boot defconfig
# Try common RK3588 defconfigs: rk3588_defconfig, rock-5b-rk3588_defconfig
# Will need to verify which one works or create custom defconfig
UBOOT_MACHINE ?= "rk3588_defconfig"

MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

MACHINE_FEATURES += "wifi bluetooth"

# Use linux-yocto as kernel provider (from rockchip-defaults.inc)
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
