#
# RK3588 navonz_v1 profile — verified pinned snapshot (yocto-nanopc-t6 commits)
# Machine config from meta-rockchip @ pinned revision (no custom layer overrides)
#

MACHINE ??= "nanopc-t6"

TMPDIR = "${TOPDIR}/tmp"

DL_DIR ?= "/home/yocto/downloads"
SSTATE_DIR ?= "/home/yocto/sstate-cache"

BB_NUMBER_THREADS ?= "20"
PARALLEL_MAKE ?= "-j20"

BB_DISKMON_DIRS = "\
    STOPTASKS,${TMPDIR},10G,1K \
    STOPTASKS,${DL_DIR},10G,1K \
    STOPTASKS,${SSTATE_DIR},10G,1K \
    HALT,${TMPDIR},5G,1K \
    HALT,${DL_DIR},5G,1K \
    HALT,${SSTATE_DIR},5G,1K \
"

PREFERRED_VERSION_gdb = "10.2"
PACKAGECONFIG:remove:pn-gdb = ""

BB_GIT_SHALLOW = "1"
BB_GENERATE_SHALLOW_TARBALLS = "1"
BB_GIT_SHALLOW_DEPTH = "1"

BB_GENERATE_MIRROR_TARBALLS = "1"
PACKAGE_CLASSES = "package_rpm"

DISTRO ?= "poky"
SDKMACHINE ?= "x86_64"
