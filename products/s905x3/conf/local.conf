#
# This file is your local configuration file for all supported
# machines and features of poky. It is used to set a default machine
# to target and enable or disable various features.
#
# Lines starting with '#' are comments.  Your changes should be added
# after the '#' comment marker.  For example, to change the target
# machine, uncomment the MACHINE line and change it to the machine
# you want to build for.
#
# See the comments at the top of conf/local.conf.sample for more
# information on the various options available to you.

# MACHINE ??= "amlogic-s905x3"  # Requires meta-amlogic layer
MACHINE ??= "qemuarm"  # Temporary: using generic machine until meta-amlogic is available

# Where to place output files
TMPDIR = "${TOPDIR}/tmp"

# Where to save source files
# Use local directory (SSD mount requires root permission)
DL_DIR ?= "/home/yocto/downloads"

# Where to save shared state files
# Use local directory (SSD mount requires root permission)
SSTATE_DIR ?= "/home/yocto/sstate-cache"

# Use default TMPDIR for system stability (RAM disk disabled)

# Performance optimization - 20 threads (reduced from 80 to prevent crashes)
BB_NUMBER_THREADS ?= "20"
PARALLEL_MAKE ?= "-j20"

# Disk space monitoring
BB_DISKMON_DIRS = "\
    STOPTASKS,${TMPDIR},10G,1K \
    STOPTASKS,${DL_DIR},10G,1K \
    STOPTASKS,${SSTATE_DIR},10G,1K \
    HALT,${TMPDIR},5G,1K \
    HALT,${DL_DIR},5G,1K \
    HALT,${SSTATE_DIR},5G,1K \
"

# Fix GDB linking errors (known issue with GDB 11.2)
EXTRA_IMAGE_FEATURES:remove = " tools-debug"
PACKAGECONFIG:remove:pn-gdb = ""

# Git optimization - shallow clones to save disk space
BB_GIT_SHALLOW = "1"
BB_GENERATE_SHALLOW_TARBALLS = "1"
BB_GIT_SHALLOW_DEPTH = "1"

# Package classes
BB_GENERATE_MIRROR_TARBALLS = "1"
PACKAGE_CLASSES = "package_rpm"

# Additional image features
EXTRA_IMAGE_FEATURES ?= "debug-tweaks"

# Distribution selection
DISTRO ?= "poky"

# Package management
PACKAGE_CLASSES ?= "package_rpm"

# SDK target architecture
SDKMACHINE ?= "x86_64"

