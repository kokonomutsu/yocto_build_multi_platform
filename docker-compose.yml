version: '3.8'

services:
  yocto:
    build:
      context: .
      dockerfile: Dockerfile
    image: yocto-build-image:latest
    container_name: yocto_build
    working_dir: /home/yocto
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./layers:/home/yocto/layers
      - ./build-s905x3:/home/yocto/build-s905x3
      - ./build-rpi4:/home/yocto/build-rpi4
      - ./build-rpi0w:/home/yocto/build-rpi0w
      - ./build-rk3588:/home/yocto/build-rk3588
      - ./downloads:/home/yocto/downloads
      - ./sstate-cache:/home/yocto/sstate-cache
      - ./logs:/home/yocto/logs
      - ./scripts:/home/yocto/scripts
      - ./products:/home/yocto/products
      - ./manifests:/home/yocto/manifests
      - /mnt/ssd/downloads-s905x3:/mnt/ssd/downloads-s905x3:rw
      - /mnt/ssd/downloads-rpi4:/mnt/ssd/downloads-rpi4:rw
      - /mnt/ssd/sstate-cache-s905x3:/mnt/ssd/sstate-cache-s905x3:rw
      - /mnt/ssd/sstate-cache-rpi4:/mnt/ssd/sstate-cache-rpi4:rw
    environment:
      - LANG=en_US.UTF-8
      - LC_ALL=en_US.UTF-8
    stdin_open: true
    tty: true

